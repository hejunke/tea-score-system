<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>茶艺部每日评分系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            backdrop-filter: blur(10px);
        }
        
        header h1 {
            font-size: 28px;
            color: #fff;
            margin-bottom: 10px;
        }
        
        header p {
            color: #888;
            font-size: 14px;
        }
        
        .sync-status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            margin-top: 8px;
        }
        
        .sync-status.syncing {
            background: rgba(255, 193, 7, 0.2);
            color: #ffc107;
        }
        
        .sync-status.success {
            background: rgba(76, 175, 80, 0.2);
            color: #4caf50;
        }
        
        .sync-status.error {
            background: rgba(244, 67, 54, 0.2);
            color: #f44336;
        }
        
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .tab {
            flex: 1;
            min-width: 80px;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #aaa;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            font-size: 13px;
        }
        
        .tab:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border-color: transparent;
        }
        
        .view {
            display: none;
            animation: fadeIn 0.3s;
        }
        
        .view.active {
            display: block;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        
        .card h2 {
            font-size: 18px;
            color: #fff;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #aaa;
            font-size: 14px;
        }
        
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }
        
        .dimension-selector {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .dimension-checkbox {
            display: flex;
            align-items: center;
            padding: 14px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            user-select: none;
        }
        
        .dimension-checkbox:hover {
            background: rgba(102, 126, 234, 0.1);
            border-color: rgba(102, 126, 234, 0.3);
        }
        
        .dimension-checkbox.selected {
            background: rgba(102, 126, 234, 0.2);
            border-color: #667eea;
        }
        
        .dimension-checkbox .check-icon {
            width: 22px;
            height: 22px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 6px;
            margin-right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            flex-shrink: 0;
        }
        
        .dimension-checkbox.selected .check-icon {
            background: #667eea;
            border-color: #667eea;
        }
        
        .dimension-checkbox.selected .check-icon::after {
            content: '✓';
            color: #fff;
            font-size: 14px;
        }
        
        .dimension-checkbox .dim-name {
            font-size: 14px;
            color: #ddd;
        }
        
        .dimension-card {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        
        .dimension-card h3 {
            font-size: 16px;
            color: #fff;
            margin-bottom: 8px;
        }
        
        .dimension-card .desc {
            font-size: 13px;
            color: #888;
            margin-bottom: 16px;
            line-height: 1.5;
        }
        
        .score-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .score-option {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            user-select: none;
        }
        
        .score-option:hover {
            background: rgba(255, 255, 255, 0.06);
        }
        
        .score-option.selected {
            background: rgba(102, 126, 234, 0.15);
            border-color: #667eea;
        }
        
        .score-option .radio-icon {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            margin-right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            flex-shrink: 0;
        }
        
        .score-option.selected .radio-icon {
            border-color: #667eea;
        }
        
        .score-option.selected .radio-icon::after {
            content: '';
            width: 10px;
            height: 10px;
            background: #667eea;
            border-radius: 50%;
        }
        
        .score-option .option-text {
            flex: 1;
            font-size: 14px;
            color: #ddd;
        }
        
        .score-option .option-score {
            font-size: 14px;
            font-weight: 600;
            color: #667eea;
            margin-left: 8px;
        }
        
        .score-option.selected .option-score {
            color: #fff;
        }
        
        .summary-card {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.2) 0%, rgba(118, 75, 162, 0.2) 100%);
            border-radius: 16px;
            padding: 24px;
            margin-top: 20px;
            border: 1px solid rgba(102, 126, 234, 0.3);
        }
        
        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .summary-row:last-child {
            border-bottom: none;
        }
        
        .summary-row .label {
            color: #aaa;
            font-size: 14px;
        }
        
        .summary-row .value {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
        }
        
        .summary-row.total .value {
            font-size: 24px;
            color: #667eea;
        }
        
        .rating-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }
        
        .rating-excellent { background: rgba(76, 175, 80, 0.2); color: #4caf50; }
        .rating-good { background: rgba(33, 150, 243, 0.2); color: #2196f3; }
        .rating-pass { background: rgba(255, 193, 7, 0.2); color: #ffc107; }
        .rating-improve { background: rgba(255, 152, 0, 0.2); color: #ff9800; }
        .rating-fail { background: rgba(244, 67, 54, 0.2); color: #f44336; }
        
        .btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            margin-top: 10px;
        }
        
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            box-shadow: none;
        }
        
        .score-list-item {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .score-list-item:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(102, 126, 234, 0.3);
        }
        
        .score-list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .score-list-name {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
        }
        
        .score-list-total {
            font-size: 20px;
            font-weight: 700;
            color: #667eea;
        }
        
        .score-list-meta {
            display: flex;
            gap: 16px;
            font-size: 13px;
            color: #888;
            flex-wrap: wrap;
        }
        
        .score-list-dimensions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        
        .dim-tag {
            padding: 4px 10px;
            background: rgba(102, 126, 234, 0.15);
            border-radius: 6px;
            font-size: 12px;
            color: #667eea;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: #1a1a2e;
            border-radius: 16px;
            padding: 24px;
            max-width: 500px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .modal-close {
            float: right;
            font-size: 24px;
            color: #888;
            cursor: pointer;
            background: none;
            border: none;
        }
        
        .modal-close:hover {
            color: #fff;
        }
        
        .share-card {
            background: linear-gradient(135deg, #1a1a2e 0%, #2d2d44 100%);
            border-radius: 16px;
            padding: 24px;
            margin: 20px 0;
            border: 1px solid rgba(102, 126, 234, 0.3);
        }
        
        .share-card-header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .share-card-header h3 {
            color: #fff;
            font-size: 18px;
            margin-bottom: 8px;
        }
        
        .share-card-header .date {
            color: #888;
            font-size: 13px;
        }
        
        .share-card-body {
            margin-bottom: 20px;
        }
        
        .share-card-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 14px;
        }
        
        .share-card-row .label {
            color: #aaa;
        }
        
        .share-card-row .value {
            color: #fff;
            font-weight: 500;
        }
        
        .share-card-footer {
            text-align: center;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            color: #666;
            font-size: 12px;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #666;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: #888;
        }
        
        .loading::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }
        
        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }
        
        /* 名单管理样式 */
        .employee-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .employee-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            transition: all 0.3s;
        }
        
        .employee-item:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(102, 126, 234, 0.3);
        }
        
        .employee-name {
            font-size: 15px;
            color: #fff;
        }
        
        .btn-delete {
            padding: 6px 12px;
            background: rgba(244, 67, 54, 0.15);
            border: 1px solid rgba(244, 67, 54, 0.3);
            border-radius: 6px;
            color: #f44336;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-delete:hover {
            background: rgba(244, 67, 54, 0.25);
        }
        
        .add-employee-form {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .add-employee-form input {
            flex: 1;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
        }
        
        .add-employee-form input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn-add {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
        }
        
        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }
        
        /* 可搜索下拉选择框 */
        .employee-select-wrapper {
            position: relative;
        }
        
        .employee-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            max-height: 200px;
            overflow-y: auto;
            background: #1a1a2e;
            border: 1px solid rgba(102, 126, 234, 0.3);
            border-radius: 10px;
            margin-top: 4px;
            z-index: 100;
            display: none;
        }
        
        .employee-dropdown.show {
            display: block;
        }
        
        .employee-option {
            padding: 12px 16px;
            cursor: pointer;
            transition: background 0.2s;
            color: #ddd;
            font-size: 14px;
        }
        
        .employee-option:hover {
            background: rgba(102, 126, 234, 0.15);
        }
        
        .employee-option.selected {
            background: rgba(102, 126, 234, 0.2);
            color: #fff;
        }
        
        /* 评分记录删除按钮 */
        .score-list-item {
            position: relative;
        }
        
        .btn-delete-score {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 28px;
            height: 28px;
            background: rgba(244, 67, 54, 0.1);
            border: 1px solid rgba(244, 67, 54, 0.2);
            border-radius: 6px;
            color: #f44336;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        
        .btn-delete-score:hover {
            background: rgba(244, 67, 54, 0.25);
            transform: scale(1.1);
        }
        
        @media (max-width: 600px) {
            .dimension-selector {
                grid-template-columns: 1fr;
            }
            
            header h1 {
                font-size: 22px;
            }
            
            .tabs {
                flex-direction: column;
            }
            
            .tab {
                min-width: auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🍵 茶艺部每日评分系统</h1>
            <p>加定餐饮 · 楼面经理评分工具</p>
            <div id="sync-status" class="sync-status" style="display:none;"></div>
        </header>
        
        <div class="tabs">
            <div class="tab active" data-view="score">📝 评分</div>
            <div class="tab" data-view="list">📋 记录</div>
            <div class="tab" data-view="stats">📈 统计</div>
            <div class="tab" data-view="employees">👥 名单</div>
        </div>
        
        <!-- 评分录入视图 -->
        <div class="view active" id="view-score">
            <div class="card">
                <h2>基本信息</h2>
                <div class="form-group">
                    <label>评分日期</label>
                    <input type="date" id="score-date">
                </div>
                <div class="form-group">
                    <label>被评茶艺师</label>
                    <div class="employee-select-wrapper">
                        <input type="text" id="employee-name" placeholder="点击选择或输入搜索..." autocomplete="off">
                        <div class="employee-dropdown" id="employee-dropdown"></div>
                    </div>
                </div>
                <div class="form-group">
                    <label>评分人（楼面经理）</label>
                    <input type="text" id="evaluator-name" placeholder="输入评分人姓名">
                </div>
            </div>
            
            <div class="card">
                <h2>选择评分维度（6选4）</h2>
                <div class="dimension-selector" id="dimension-selector">
                    <div class="dimension-checkbox" data-dim="自我管理">
                        <span class="check-icon"></span>
                        <span class="dim-name">自我管理</span>
                    </div>
                    <div class="dimension-checkbox" data-dim="仪容仪表">
                        <span class="check-icon"></span>
                        <span class="dim-name">仪容仪表</span>
                    </div>
                    <div class="dimension-checkbox" data-dim="工作配合">
                        <span class="check-icon"></span>
                        <span class="dim-name">工作配合</span>
                    </div>
                    <div class="dimension-checkbox" data-dim="工作效率">
                        <span class="check-icon"></span>
                        <span class="dim-name">工作效率</span>
                    </div>
                    <div class="dimension-checkbox" data-dim="贡献付出">
                        <span class="check-icon"></span>
                        <span class="dim-name">贡献付出</span>
                    </div>
                    <div class="dimension-checkbox" data-dim="微笑服务">
                        <span class="check-icon"></span>
                        <span class="dim-name">微笑服务</span>
                    </div>
                </div>
            </div>
            
            <div id="dimension-cards"></div>
            
            <div class="card">
                <h2>管理层加分（可选）</h2>
                <div class="form-group">
                    <label>加分人</label>
                    <select id="management-bonus-by">
                        <option value="">无加分</option>
                        <option value="总经理">总经理</option>
                        <option value="驻店股东">驻店股东</option>
                        <option value="店长">店长</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>加分数值（20-60分）</label>
                    <input type="number" id="management-bonus" min="20" max="60" placeholder="输入加分分值">
                </div>
                <div class="form-group">
                    <label>加分理由（选填）</label>
                    <textarea id="management-bonus-reason" placeholder="说明加分原因"></textarea>
                </div>
            </div>
            
            <div class="summary-card" id="score-summary">
                <div class="summary-row">
                    <span class="label">基础得分</span>
                    <span class="value" id="summary-base">0分</span>
                </div>
                <div class="summary-row">
                    <span class="label">维度加分</span>
                    <span class="value" id="summary-bonus">0分</span>
                </div>
                <div class="summary-row">
                    <span class="label">管理层加分</span>
                    <span class="value" id="summary-mgmt">0分</span>
                </div>
                <div class="summary-row total">
                    <span class="label">当日总分</span>
                    <span class="value" id="summary-total">0分</span>
                </div>
            </div>
            
            <div class="form-group" style="margin-top: 20px;">
                <label>评语（选填）</label>
                <textarea id="comment" placeholder="输入今日评语..."></textarea>
            </div>
            
            <button class="btn" id="submit-btn" onclick="submitScore()">提交评分</button>
            <button class="btn btn-secondary" onclick="generateDailySummary()">生成当日汇总分享</button>
        </div>
        
        <!-- 评分记录视图 -->
        <div class="view" id="view-list">
            <div class="card">
                <h2>评分记录</h2>
                <div class="form-group">
                    <label>筛选日期</label>
                    <input type="date" id="filter-date" onchange="loadScores()">
                </div>

        // Supabase REST API 调用
        async function supabaseRequest(endpoint, method = 'GET', body = null) {
            const options = {
                method,
                headers: {
                    'apikey': SUPABASE_KEY,
                    'Authorization': `Bearer ${SUPABASE_KEY}`,
                    'Content-Type': 'application/json',
                    'Prefer': 'return=representation'
                }
            };
            
            if (body) {
                // Supabase REST API 插入操作需要数组格式
                options.body = JSON.stringify(Array.isArray(body) ? body : [body]);
            }
            
            const response = await fetch(`${SUPABASE_URL}/rest/v1/${endpoint}`, options);
            
            if (!response.ok) {
                const error = await response.text();
                throw new Error(`Supabase error: ${error}`);
            }
            
            return response.json();
        }

            const container = document.getElementById('dimension-cards');

                `;

                // 绑定选项事件
                card.querySelectorAll('.score-option').forEach(opt => {
                    opt.addEventListener('click', function() {
                        const dimName = this.dataset.dim;

                        updateSummary();

                const noteInput = card.querySelector(`#dim-note-${dim}`);
                noteInput.addEventListener('input', function() {

        function updateSummary() {
            let baseScore = 0;
            let bonusScore = 0;
            
            Object.values(dimensionScores).forEach(ds => {
                if (ds.score >= 20) {
                    baseScore += 20;
                    if (ds.score > 20) bonusScore += 5;
                } else {
                    baseScore += ds.score;
                }
            });
            
            const mgmtBonus = parseInt(document.getElementById('management-bonus').value) || 0;
            const total = baseScore + bonusScore + mgmtBonus;
            
            document.getElementById('summary-base').textContent = `${baseScore}分`;
            document.getElementById('summary-bonus').textContent = `+${bonusScore}分`;
            document.getElementById('summary-mgmt').textContent = mgmtBonus > 0 ? `+${mgmtBonus}分` : '0分';
            document.getElementById('summary-total').textContent = `${total}分`;
        }
        
        async function submitScore() {
            const date = document.getElementById('score-date').value;
            const employee = document.getElementById('employee-name').value.trim();
            const evaluator = document.getElementById('evaluator-name').value.trim();
            
            if (!date || !employee || !evaluator) {
                alert('请填写完整基本信息');
                return;
            }
            
            if (selectedDimensions.length !== 4) {
                alert('请选择4个评分维度');
                return;
            }
            
            if (Object.keys(dimensionScores).length !== 4) {
                alert('请完成所有维度的评分');
                return;
            }
            
            const mgmtBonusBy = document.getElementById('management-bonus-by').value;
            const mgmtBonus = parseInt(document.getElementById('management-bonus').value) || 0;
            const mgmtReason = document.getElementById('management-bonus-reason').value.trim();
            
            if (mgmtBonusBy && !mgmtBonus) {
                alert('选择了加分人但未填写加分分值');
                return;
            }
            
            // 计算分数
            let baseScore = 0;
            let bonusScore = 0;
            const dimResults = [];
            
            selectedDimensions.forEach(dim => {
                const ds = dimensionScores[dim];
                const note = document.getElementById(`dim-note-${dim}`).value.trim();
                dimResults.push({
                    name: dim,
                    score: ds.score,
                    level: ds.level,
                    note: note
                });
                
                if (ds.score >= 20) {
                    baseScore += 20;
                    if (ds.score > 20) bonusScore += 5;
                } else {
                    baseScore += ds.score;
                }
            });
            
            const total = baseScore + bonusScore + mgmtBonus;
            
            const comment = document.getElementById('comment').value.trim();
            
            const scoreData = {
                score_date: date,
                employee_name: employee,
                evaluator_name: evaluator,
                dimensions: dimResults,
                base_score: baseScore,
                bonus_score: bonusScore,
                management_bonus: mgmtBonus,
                management_bonus_by: mgmtBonusBy || null,
                management_bonus_reason: mgmtReason || null,
                total_score: total,
                rating: '',  // 每日不评级，留空
                comment: comment || null,
                store_name: STORE_ID  // 门店标识
            };
            
            // 提交按钮禁用
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.textContent = '提交中...';
            showSyncStatus('正在同步到云端...', 'syncing');
            
            try {
                await supabaseRequest('tea_scores', 'POST', scoreData);
                showSyncStatus('✓ 提交成功', 'success');
                alert('评分提交成功！');
                resetForm();
            } catch (error) {
                console.error('提交失败:', error);
                showSyncStatus('✗ 提交失败', 'error');
                alert('提交失败：' + error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '提交评分';
            }
        }

            dimensionScores = {};
            updateSummary();
        }
        
        async function loadScores() {
            const filterDate = document.getElementById('filter-date').value;

            container.innerHTML = '<div class="loading">加载中</div>';
            
            try {
                let endpoint = `tea_scores?store_name=eq.${STORE_ID}&order=created_at.desc`;
                if (filterDate) {
                    endpoint += `&score_date=eq.${filterDate}`;
                }
                
                const data = await supabaseRequest(endpoint);
                allScores = data;
                
                if (data.length === 0) {
                    container.innerHTML = '<div class="empty-state"><p>暂无评分记录</p></div>';
                    return;

                container.innerHTML = data.map((score, idx) => `
                    <div class="score-list-item">
                        <button class="btn-delete-score" onclick="event.stopPropagation(); deleteScore(${score.id})" title="删除">×</button>
                        <div onclick="showDetail(${idx})">

                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('加载失败:', error);
                container.innerHTML = '<div class="empty-state"><p>加载失败，请刷新重试</p></div>';
            }
        }

                        ${score.management_bonus > 0 ? `
                            <div class="share-card-row">
                                <span class="label">管理层加分</span>
                                <span class="value">+${score.management_bonus}分 (${score.management_bonus_by})</span>
                            </div>
                            ${score.management_bonus_reason ? `
                                <div class="share-card-row">
                                    <span class="label">加分理由</span>
                                    <span class="value">${score.management_bonus_reason}</span>
                                </div>
                            ` : ''}
                        ` : ''}
                        <div class="share-card-row" style="border-top: 1px solid rgba(255,255,255,0.1); padding-top: 12px; margin-top: 12px;">
                            <span class="label" style="font-size: 16px;">当日总分</span>
                            <span class="value" style="font-size: 20px; color: #667eea;">${score.total_score}分</span>
                        </div>
                        ${score.comment ? `
                            <div style="margin-top: 16px; padding: 12px; background: rgba(255,255,255,0.05); border-radius: 8px;">
                                <div style="font-size: 13px; color: #888; margin-bottom: 4px;">评语</div>
                                <div style="font-size: 14px; color: #ddd;">${score.comment}</div>
                            </div>
                        ` : ''}
                    </div>
                    <div class="share-card-footer">
                        ${STORE_INFO.name} · 茶艺部评分系统
                    </div>
                </div>
                <button class="btn" onclick="copyShareText(${idx})">复制分享文本</button>
            `;
            
            modal.classList.add('active');
        }
        
        function closeModal() {
            document.getElementById('detail-modal').classList.remove('active');
        }
        
        function copyShareText(idx) {
            const score = allScores[idx];
            
            let text = `📊 茶艺部每日评分 - ${score.score_date}\n\n`;
            text += `👤 被评人：${score.employee_name}\n`;
            text += `📝 评分人：${score.evaluator_name}\n\n`;
            text += `✅ 评分维度：\n`;
            score.dimensions.forEach(d => {
                text += `• ${d.name}：${d.score > 0 ? '+' : ''}${d.score}分${d.note ? ' (' + d.note + ')' : ''}\n`;
            });
            if (score.management_bonus > 0) {
                text += `\n➕ 管理层加分：+${score.management_bonus}分 (${score.management_bonus_by})\n`;
                if (score.management_bonus_reason) {
                    text += `理由：${score.management_bonus_reason}\n`;
                }
            }
            text += `\n🏆 当日总分：${score.total_score}分\n`;
            if (score.comment) {
                text += `\n💬 评语：${score.comment}\n`;
            }
            
            navigator.clipboard.writeText(text).then(() => {
                alert('已复制到剪贴板，可粘贴到工作群');
            }).catch(() => {
                alert('复制失败，请手动复制');
            });
        }
        
        function generateShareCard() {
            const date = document.getElementById('score-date').value;
            const employee = document.getElementById('employee-name').value.trim();
            const evaluator = document.getElementById('evaluator-name').value.trim();
            
            if (!employee) {
                alert('请先填写被评人姓名');
                return;
            }
            
            let text = `📊 茶艺部每日评分 - ${date || '今日'}\n\n`;
            text += `👤 被评人：${employee}\n`;
            text += `📝 评分人：${evaluator || '待填写'}\n\n`;
            
            if (selectedDimensions.length > 0) {
                text += `✅ 评分维度：\n`;
                selectedDimensions.forEach(dim => {
                    const ds = dimensionScores[dim];
                    if (ds) {
                        const note = document.getElementById(`dim-note-${dim}`).value.trim();
                        text += `• ${dim}：${ds.score > 0 ? '+' : ''}${ds.score}分${note ? ' (' + note + ')' : ''}\n`;
                    } else {
                        text += `• ${dim}：待评分\n`;
                    }
                });
            }
            
            const mgmtBonus = parseInt(document.getElementById('management-bonus').value) || 0;
            const mgmtBy = document.getElementById('management-bonus-by').value;
            if (mgmtBonus > 0) {
                text += `\n➕ 管理层加分：+${mgmtBonus}分 (${mgmtBy})\n`;
            }
            
            const total = document.getElementById('summary-total').textContent;
            text += `\n🏆 当日总分：${total}\n`;
            
            navigator.clipboard.writeText(text).then(() => {
                alert('分享文本已生成并复制');
            }).catch(() => {
                alert('复制失败');
            });
        }
        
        async function generateDailySummary() {
            const filterDate = document.getElementById('filter-date').value;
            if (!filterDate) {
                alert('请先选择日期');
                return;
            }
            
            try {
                const data = await supabaseRequest(`tea_scores?store_name=eq.${STORE_ID}&score_date=eq.${filterDate}&order=created_at.asc`);
                
                if (data.length === 0) {
                    alert('该日期暂无评分记录');
                    return;
                }
                
                let text = `📊 ${STORE_INFO.name} - 茶艺部每日评分汇总 - ${filterDate}\n\n`;
                
                data.forEach((score, idx) => {
                    text += `${idx + 1}️⃣ ${score.employee_name} - 总分：${score.total_score}分\n`;
                    text += `   📝 评分人：${score.evaluator_name}\n`;
                    text += `   ✅ 评分维度：\n`;
                    
                    score.dimensions.forEach(d => {
                        text += `   • ${d.name}：${d.score > 0 ? '+' : ''}${d.score}分${d.note ? ' (' + d.note + ')' : ''}\n`;
                    });
                    
                    if (score.management_bonus > 0) {
                        text += `   ➕ 管理层加分：+${score.management_bonus}分 (${score.management_bonus_by})\n`;
                        if (score.management_bonus_reason) {
                            text += `   理由：${score.management_bonus_reason}\n`;
                        }
                    }
                    
                    if (score.comment) {
                        text += `   💬 评语：${score.comment}\n`;
                    }
                    
                    text += `\n`;
                });
                
                text += `共评${data.length}人 · ${STORE_INFO.name}`;
                
                navigator.clipboard.writeText(text).then(() => {
                    alert('当日汇总已复制到剪贴板');
                }).catch(() => {
                    alert('复制失败，请手动复制');
                });
            } catch (error) {
                console.error('生成汇总失败:', error);
                alert('生成失败，请重试');
            }
        }
        
        async function loadStats() {
            const month = document.getElementById('stats-month').value;
            if (!month) return;
            
            const container = document.getElementById('stats-content');
            container.innerHTML = '<div class="loading">加载中</div>';
            
            try {
                const startDate = `${month}-01`;
                const endDate = `${month}-31`;
                
                const data = await supabaseRequest(
                    `tea_scores?store_name=eq.${STORE_ID}&score_date=gte.${startDate}&score_date=lte.${endDate}&order=score_date.asc`
                );
                
                if (data.length === 0) {
                    container.innerHTML = '<div class="empty-state"><p>该月份暂无数据</p></div>';
                    document.getElementById('btn-share-monthly').style.display = 'none';
                    return;
                }
                
                // 按员工分组统计
                const employeeStats = {};
                data.forEach(s => {
                    if (!employeeStats[s.employee_name]) {
                        employeeStats[s.employee_name] = {
                            scores: [],
                            total: 0,
                            count: 0
                        };
                    }
                    employeeStats[s.employee_name].scores.push(s);
                    employeeStats[s.employee_name].total += s.total_score;
                    employeeStats[s.employee_name].count++;
                });
                
                // 保存统计数据供分享使用
                monthlyStatsData = employeeStats;
                
                let html = '<h3 style="color: #fff; margin-bottom: 16px;">员工月度统计</h3>';
                html += '<p style="color: #888; font-size: 13px; margin-bottom: 20px;">月度平均分 = 当月所有日期总分之和 ÷ 评分天数（含管理层加分）</p>';
                
                Object.entries(employeeStats).forEach(([name, stats]) => {
                    const avg = (stats.total / stats.count).toFixed(1);
                    let rating = '';
                    let reward = '';
                    let ratingClass = '';
                    if (avg >= 90) { rating = '优秀'; reward = '奖励500元'; ratingClass = 'rating-excellent'; }
                    else if (avg >= 80) { rating = '良好'; reward = '奖励300元'; ratingClass = 'rating-good'; }
                    else if (avg >= 70) { rating = '合格'; reward = '奖励100元'; ratingClass = 'rating-pass'; }
                    else if (avg >= 60) { rating = '需整改'; reward = '无奖励'; ratingClass = 'rating-improve'; }
                    else { rating = '不合格'; reward = '需更换人员'; ratingClass = 'rating-fail'; }
                    
                    html += `
                        <div class="card" style="margin-bottom: 12px;">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                                <span style="font-size: 16px; font-weight: 600; color: #fff;">${name}</span>
                                <span class="rating-badge ${ratingClass}">${rating}</span>
                            </div>
                            <div style="display: flex; gap: 20px; font-size: 13px; color: #888; margin-bottom: 8px;">
                                <span>评分天数：${stats.count}天</span>
                                <span>月度平均分：${avg}分</span>
                            </div>
                            <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: rgba(102,126,234,0.1); border-radius: 8px;">
                                <span style="font-size: 13px; color: #aaa;">月度奖励</span>
                                <span style="font-size: 14px; font-weight: 600; color: #667eea;">${reward}</span>
                            </div>
                        </div>
                    `;
                });
                
                container.innerHTML = html;
                document.getElementById('btn-share-monthly').style.display = 'block';
            } catch (error) {
                console.error('加载统计失败:', error);
                container.innerHTML = '<div class="empty-state"><p>加载失败，请刷新重试</p></div>';
            }
        }
        
        // 点击弹窗外部关闭
        document.getElementById('detail-modal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
        
        // ========== 名单管理功能 ==========
        
        async function loadEmployees() {
            const container = document.getElementById('employee-list');
            container.innerHTML = '<div class="loading">加载中</div>';
            
            try {
                const data = await supabaseRequest(`tea_employees?store_name=eq.${STORE_ID}&order=name.asc`);
                employeeList = data;
                
                if (data.length === 0) {
                    container.innerHTML = '<div class="empty-state"><p>暂无茶艺师，请添加</p></div>';
                    return;
                }
                
                container.innerHTML = data.map(e => `
                    <div class="employee-item">
                        <span class="employee-name">${e.name}</span>
                        <button class="btn-delete" onclick="deleteEmployee(${e.id}, '${e.name}')">删除</button>
                    </div>
                `).join('');
            } catch (error) {
                console.error('加载名单失败:', error);
                container.innerHTML = '<div class="empty-state"><p>加载失败，请刷新重试</p></div>';
            }
        }
        
        async function addEmployee() {
            const input = document.getElementById('new-employee-name');
            const name = input.value.trim();
            
            if (!name) {
                alert('请输入茶艺师姓名');
                return;
            }
            
            // 检查是否已存在
            if (employeeList.some(e => e.name === name)) {
                alert('该茶艺师已存在');
                return;
            }
            
            try {
                await supabaseRequest('tea_employees', 'POST', { name: name, store_name: STORE_ID });
                input.value = '';
                loadEmployees();
                showSyncStatus('✓ 添加成功', 'success');
            } catch (error) {
                console.error('添加失败:', error);
                alert('添加失败：' + error.message);
            }
        }
        
        async function deleteEmployee(id, name) {
            if (!confirm(`确定删除茶艺师「${name}」吗？`)) {
                return;
            }
            
            try {
                await supabaseRequest(`tea_employees?id=eq.${id}`, 'DELETE');
                loadEmployees();
                showSyncStatus('✓ 删除成功', 'success');
            } catch (error) {
                console.error('删除失败:', error);
                alert('删除失败：' + error.message);
            }
        }
        
        // ========== 删除评分记录功能 ==========
        
        async function deleteScore(id) {
            if (!confirm('确定删除该条评分记录吗？')) {
                return;
            }
            
            try {
                await supabaseRequest(`tea_scores?id=eq.${id}`, 'DELETE');
                loadScores();
                showSyncStatus('✓ 删除成功', 'success');
            } catch (error) {
                console.error('删除失败:', error);
                alert('删除失败：' + error.message);
            }
        }
        
        // ========== 月度统计分享功能 ==========
        
        let monthlyStatsData = null;
        
        async function shareMonthlyStats() {
            if (!monthlyStatsData) {
                alert('请先加载月度统计数据');
                return;
            }
            
            const month = document.getElementById('stats-month').value;
            const [year, monthNum] = month.split('-');
            
            let text = `📊 ${STORE_INFO.name} - 茶艺部月度评分汇总 - ${year}年${parseInt(monthNum)}月\n\n`;
            
            Object.entries(monthlyStatsData).forEach(([name, stats], idx) => {
                const avg = (stats.total / stats.count).toFixed(1);
                let rating = '';
                let reward = '';
                if (avg >= 90) { rating = '优秀'; reward = '奖励500元'; }
                else if (avg >= 80) { rating = '良好'; reward = '奖励300元'; }
                else if (avg >= 70) { rating = '合格'; reward = '奖励100元'; }
                else if (avg >= 60) { rating = '需整改'; reward = '无奖励'; }
                else { rating = '不合格'; reward = '需更换人员'; }
                
                text += `${idx + 1}️⃣ ${name}\n`;
                text += `   评分天数：${stats.count}天 | 月度平均分：${avg}分\n`;
                text += `   评级：${rating} | 奖励：${reward}\n\n`;
            });
            
            text += `共评${Object.keys(monthlyStatsData).length}人 · ${STORE_INFO.name}`;
            
            navigator.clipboard.writeText(text).then(() => {
                alert('月度汇总已复制到剪贴板');
            }).catch(() => {
                alert('复制失败，请手动复制');
            });
        }
    </script>
</body>
